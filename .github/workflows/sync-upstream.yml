name: sync-upstream-main

# 上游的 `main` 已停在 2026-10-23（最后一条是「从源码树移除签名脚本」），
# 活跃开发全在 `beta`。本仓库原先的 main 工作流跟着 `upstream main`，
# 于是永远同步不到新 provider —— 线上那份 0.2.1 就是这么来的。
# 这里改成跟 `upstream beta`，把结果落到本仓库 `main`。
#
# ── 包 id 只在构建时改，不回写分支 ──────────────────────────
# 以前这里直接改工作区的 pack.json 再 push origin beta，于是私有仓库自己的
# `pack.json` 从上游的 `agent2api-providers` 变成了 `ssujojo-providers`。
# 后果是下一次 `git merge upstream/beta` 在同一个文件上真冲突，而且源码与
# 上游不再可比 ——「跟随上游」这件事变成靠人记得别改错。
# 现在改成 `scripts/release-manifest.mjs --out dist/pack.json`：分支上永远是
# 上游清单，产物里才是私有 id。
on:
  schedule:
    - cron: "30 */6 * * *"
  workflow_dispatch:
    inputs:
      force_release:
        description: "即使上游没有变化也重新构建并发布（验证签名与构建链路）"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: sync-upstream-main
  cancel-in-progress: false

jobs:
  sync:
    runs-on: windows-latest
    # `build` / `publish` 靠这两个输出判断「这次到底要不要发」以及用哪个 tag。
    # 没有它们时 `needs.sync.outputs.tag` 恒为空，整个构建矩阵会被静默跳过 ——
    # 症状是「同步成功了但没有任何新包」，比失败更难发现。
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - name: Checkout fork main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Add upstream
        shell: bash
        run: git remote add upstream https://github.com/ProvidersPlugin/Agent2Providers.git

      - name: Fetch upstream
        shell: bash
        run: git fetch upstream beta --tags

      - name: Check for upstream updates
        shell: bash
        id: check
        run: |
          set -euo pipefail
          LOCAL="$(git rev-parse HEAD)"
          UPSTREAM="$(git rev-parse upstream/beta)"
          if [[ "$LOCAL" == "$UPSTREAM" ]]; then
            echo "updated=false" >> "$GITHUB_OUTPUT"
            if [[ "${{ inputs.force_release }}" == "true" ]]; then
              echo "mode=none" >> "$GITHUB_OUTPUT"
              echo "should_release=true" >> "$GITHUB_OUTPUT"
              echo "No upstream updates; force_release requested."
            else
              echo "No upstream updates."
            fi
            exit 0
          fi
          if git merge-base --is-ancestor "$LOCAL" "$UPSTREAM"; then
            echo "mode=fast-forward" >> "$GITHUB_OUTPUT"
          elif git merge-base --is-ancestor "$UPSTREAM" "$LOCAL"; then
            echo "mode=none" >> "$GITHUB_OUTPUT"
          else
            echo "mode=merge" >> "$GITHUB_OUTPUT"
          fi
          echo "updated=true" >> "$GITHUB_OUTPUT"
          echo "upstream_sha=$UPSTREAM" >> "$GITHUB_OUTPUT"
          echo "local_sha=$LOCAL" >> "$GITHUB_OUTPUT"
          echo "should_release=true" >> "$GITHUB_OUTPUT"

      - name: Fast-forward or merge upstream
        shell: bash
        if: steps.check.outputs.should_release == 'true'
        id: merge
        run: |
          set -euo pipefail
          BEFORE="$(git rev-parse HEAD)"
          if [[ "${{ steps.check.outputs.mode }}" == "fast-forward" ]]; then
            git merge --ff-only upstream/beta
          else
            git merge --no-ff --no-edit upstream/beta
          fi
          echo "before_sha=$BEFORE" >> "$GITHUB_OUTPUT"
          # 冲突时 git merge 会以非零退出并把工作区留在半合并状态。这里显式
          # 中止并给出可读原因：继续往下走会拿未合并的树去打包，产物不可信。
          if [ -n "$(git ls-files -u)" ]; then
            echo "::error::上游 beta 与本地补丁存在冲突，需人工解决后再同步"
            git diff --name-only --diff-filter=U
            exit 1
          fi

      - name: Validate local patches survive
        shell: bash
        if: steps.check.outputs.updated == 'true' && steps.check.outputs.mode != 'none'
        run: |
          set -euo pipefail
          # 校验 beta 分支**真的带着的**本地补丁。原来查的是 trae 的
          # prompt_cache_key —— 那条只在 main 上，beta 上永远匹配不到，
          # 一发生合并就会误报「本地补丁丢了」并中断同步。
          grep -q 'check_body_limit' crates/providers/src/providers/catpaw/body_limit.rs
          grep -q 'clamp_output_tokens' crates/providers/src/providers/officeace/chat.rs
          grep -q 'channel_rejection' crates/providers/src/providers/workbuddy/errors.rs
          grep -q 'prompt_cache_key' crates/providers/src/providers/trae/payload.rs

      - name: Push updated main
        shell: bash
        if: steps.check.outputs.should_release == 'true'
        run: git push origin main

      - name: Create release tag
        shell: bash
        if: steps.check.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        id: tag
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./pack.json').version")"
          if [[ "${{ inputs.force_release }}" != "true" ]]; then
            LAST_RELEASE_TAG="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1 --json tagName --jq '.[0].tagName // empty')"
            if [[ -n "$LAST_RELEASE_TAG" ]]; then
              LAST_COMMIT="$(git rev-list -n 1 "$LAST_RELEASE_TAG")"
              if git diff --quiet "$LAST_COMMIT" HEAD -- .; then
                echo "no-local-changes=true" >> "$GITHUB_OUTPUT"
                echo "No local changes since last release."
                exit 0
              fi
            fi
          fi
          TAG="v${VERSION}-fork.${GITHUB_RUN_NUMBER}"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            TAG="$TAG.$(date -u +%Y%m%d%H%M%S)"
          fi
          git tag "$TAG"
          git push origin "$TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # 上面提前 exit 时 tag 为空，后续所有构建 / 发布步骤都会跳过；
          # 这里把结论写进日志，免得把「无事可做」误读成「发布成功」。

  build:
    # 每个平台各自编译、各自启动一次（`verify.mjs` 是端到端握手，不是只看编译
    # 是否通过）。Windows 包给桌面端，Linux 包给 gz4 这类无界面部署 ——
    # 只出 Windows 包会让服务器继续跑官方插件，也就是这次故障的起点。
    needs: sync
    if: needs.sync.outputs.tag != ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-22.04
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.sync.outputs.tag }}
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux cross linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          mkdir -p .cargo
          cat >> .cargo/config.toml <<'EOF'
          [target.aarch64-unknown-linux-gnu]
          linker = "aarch64-linux-gnu-gcc"
          EOF

      - name: Generate release manifest
        shell: bash
        run: node scripts/release-manifest.mjs --out dist/pack.json

      - name: Check release manifest
        shell: bash
        run: |
          node --test scripts/release-manifest.test.mjs
          node scripts/release-manifest.mjs --check

      - name: Build plugin package
        shell: bash
        env:
          # Linux 的 x86_64 包要在 ubuntu-22.04（glibc 2.35）上编，
          # 与运行时 Debian bookworm（2.36）兼容；不要换到更新的 runner。
          CARGO_TARGET_DIR: target
        run: node scripts/pack.mjs --out dist --target ${{ matrix.target }} --manifest dist/pack.json

      - name: Verify plugin binary
        shell: bash
        run: |
          set -euo pipefail
          EXE="target/${{ matrix.target }}/release/agent2api-providers"
          if [[ "${{ matrix.target }}" == *windows* ]]; then EXE="$EXE.exe"; fi
          if [[ "${{ matrix.target }}" == aarch64-unknown-linux-gnu ]]; then
            # 交叉编出来的 arm64 二进制在 x86 runner 上不能直接 exec。
            # 用 qemu 跑同一套握手，至少证明「能加载 + 能说协议」；
            # 没有这一步，arm64 包是纯编译产物，第一次被 Docker 拉起才知道坏。
            sudo apt-get install -y qemu-user-static
            echo "QEMU_LD_PREFIX=/usr/aarch64-linux-gnu" >> "$GITHUB_ENV"
            node scripts/verify.mjs --exe "$EXE" --runner qemu-aarch64-static
          else
            node scripts/verify.mjs --exe "$EXE"
          fi

      - name: Sign plugin package
        shell: bash
        env:
          PLUGIN_KEY_JSON: ${{ secrets.AGENT2API_PLUGIN_KEY }}
          SKIP_SIGNING: ${{ secrets.AGENT2API_PLUGIN_KEY == 'SKIP' }}
        run: |
          set -euo pipefail
          if [[ "$SKIP_SIGNING" == 'true' ]]; then
            echo "签名私钥尚未配置，发布未签名包。"
            exit 0
          fi
          printf '%s' "$PLUGIN_KEY_JSON" > plugin-signing-key.json
          node scripts/sign.mjs sign --zip dist/*.zip --key plugin-signing-key.json --target "${{ matrix.target }}"
          rm -f plugin-signing-key.json

      - name: Upload platform package
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.target }}
          path: dist/*.zip
          if-no-files-found: error

  publish:
    # 三个平台的包齐了才发 Release：网关按 `<id>-<version>-<target>.zip`
    # 精确匹配资源名，少一个平台就等于那个平台没有新版本。
    needs: [sync, build]
    if: needs.sync.outputs.tag != ''
    runs-on: ubuntu-latest
    steps:
      - name: Download platform packages
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: package-*
          merge-multiple: true

      - name: Check package set
        shell: bash
        run: |
          set -euo pipefail
          ls -l dist
          for target in x86_64-pc-windows-msvc x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu; do
            ls dist/ssujojo-providers-*-${target}.zip
          done

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.sync.outputs.tag }}
          VERSION: ${{ needs.sync.outputs.version }}
        run: |
          set -euo pipefail
          gh release create "$TAG" dist/*.zip --repo "$GITHUB_REPOSITORY" \
            --title "SsuJojo Providers v$VERSION" \
            --notes "自动同步上游 Agent2Providers beta 并保留本地修复；包含 Windows 与两个 Linux 平台的包。"


